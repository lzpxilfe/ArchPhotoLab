[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archphotolab"
version = "0.1.0"
description = "Drone photo alignment tool for archaeology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "Pillow>=10.0",
    "PySide6>=6.7",
]

[project.scripts]
archphotolab = "main:main"
